# Candidate series from NOAA PSL's page of monthly time series, fetched together for results/real-indices.md (decision 0043).
# All 96 files the page names are fetched to apply the candidate rule (scripts/index_candidates.py); the 25 it lets in have entries here. Each is complete for 1950-01 to 2024-12.
# Known biases, all: the makers revise them, so a checksum records one fetch; several are patterns or anomalies computed with years after 1999; this project re-centres and re-scales each on its own 1950 to 1999 months.

