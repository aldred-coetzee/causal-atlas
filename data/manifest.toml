known_biases = "Built from CRU TS; quality over Africa, where station data may be thin, not checked. Standardised by its makers on the whole 1901 to 2024 record, not a reference period, so later years set the level and scale of earlier values and every new release changes every value. Affected by the makers' acknowledged PET unit conversion error in versions 2.6 to 2.12.0 (fixed in 2.13.0; effect 'generally small', 'largest in arid regions'); sources in docs/data-sources.md"

