sha256 = "27af499bc406f8e5f5e9655013d2299a97d6a1cc92f27db30990b04dbc872f60"
coverage = "Global index, monthly, 1950-01 to 2026-09"
known_biases = "A 3-month mean centred on each month, so the value at t uses t+1; revised when the SST product changes. Measured against multiple centred 30-year base periods that move with time, so a value is set against an average that includes later years and the newest values are provisional; source in docs/data-sources.md"

