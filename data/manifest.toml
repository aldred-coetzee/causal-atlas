fetch_script = "scripts/fetch_oni.py"
version = "File as fetched: ERSST v6, stated as of 2026-09-07"
licence = "Public domain per https://psl.noaa.gov/disclaimer/ (read 2026-11-09); credit NOAA/OAR/PSL"
