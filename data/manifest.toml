fetch_script = "scripts/fetch_firecci.py"
version = "ESA Fire_cci AVHRR-LTDR burned area grid product (FireCCILT11), version 1.1; doi:10.5285/62866635ab074e07b93f17fbf87a2c1a"
licence = "ESA CCI Data Policy, Fire_cci terms: any use for any purpose; acknowledge the ESA Climate Change Initiative and the Fire CCI project and cite the data set's DOI"
fetched = "2026-11-10"
sha256 = "cd9310ac83c6a1e1a7f9fdb4f311476d38bb3a8e6b20904daad55fe11362a2d7"
coverage = "Global 0.25 degree, monthly, 1982-01 to 2018-12 without 1994; 432 files, 7,198,477,344 bytes. The checksum is of data/firecci.sha256, which lists each file's own"
known_biases = "1994 absent. Stitched from several AVHRR satellites with drifting orbits. Pixels of about 5 km miss small fires. Each cell-month carries the share of burnable land observed; cloud hides fire and a dry year is a clear year, so what is seen is tied to the weather. Trained against MODIS, which starts in 2001."

[rtfp]
source_url = "https://microdata.worldbank.org/catalog/4483/download/361260/WLD_RTFP_mkt_2026-11-02.zip"
fetch_script = "scripts/fetch_rtfp.py"
version = "World Bank, Monthly food price estimates by product and market (Real Time Food Prices), WLD_2021_RTFP_v02_M, release 2026-11-02; doi:10.48529/2ZH0-JF55"
licence = "Study record: access 'open', 'Public use', 'The dataset of price estimates is published as open data'; cite Andree (2021) with the release date and DOI. A World Bank Data Catalog country entry states Creative Commons Attribution 4.0 (read by a helper, not re-checked)"
fetched = "2026-11-10"
sha256 = "a8a5fb21dce5f81467e6b1129d124ca5e28c9b56135e8306b783bd3fd77a29d7"
coverage = "37 countries, 3,229 markets (3,192 with latitude and longitude), monthly, 2007-01 to 2026-11; one zip of 133,148,482 bytes holding one CSV of 1,193,401,643 bytes, 762,728 rows, 816 columns"
known_biases = "Most columns are model estimates that fill every month from other markets, other items, exchange rates and the season; only the plain item columns are prices as collected, and that reading is from the file, not stated in the documentation seen. Observed months are sparse: 571 markets have a cereal with 120 or more. Outliers 'are often adjusted'. Starts 2007. Countries are those the Bank counts as food insecure or fragile, mostly the Sahel and eastern and southern Africa. Updated weekly; this release is pinned by checksum and its address may stop answering."

[faostat_qcl]
source_url = "https://bulks-faostat.fao.org/production/Production_Crops_Livestock_E_All_Data_(Normalized).zip"
fetch_script = "scripts/fetch_faostat.py"
version = "FAOSTAT, Crops and livestock products (QCL), bulk file in long form; the server gives its last change as 2025-12-31. The address carries no release date: a later fetch may be a different file"
licence = "CC BY 4.0, per FAO's Statistical Database Terms of Use (read at source 2026-11-10): 'all datasets disseminated through FAO corporate statistical databases ... are licensed under the Creative Commons Attribution-4.0 International licence (CC BY 4.0)', as complemented by those terms (no endorsement implied; no attempt to identify anyone). Cite: FAO. 2025. FAOSTAT: Crops and livestock products. Accessed on 10 November 2026. https://www.fao.org/faostat/en/#data/QCL Licence: CC-BY-4.0."
fetched = "2026-11-10"
sha256 = "c5835418c18f9322e7decbd6800f93a216eaae3cdfa31acb08f0518c0c6d6853"
coverage = "Countries and country groups by year, 1961 to 2024; one zip of 33,921,825 bytes holding one CSV of 545 MB (4,209,110 rows) and four code tables. Used here: yield (element 5412, kg/ha) of cereals. Country series with 40 or more years of official (flag A) yield: maize 89, rice 83, wheat 74, sorghum 61, barley 58, millet 38; 116 countries have at least one. From decision 0054 also the yield of 47 other single crops, chosen by count alone (item code under 1700, 30 or more country series with 30 or more official years): 2,339 series in 139 countries, 78,552 official figures from 1986 to 2024. Both sets of yields, 1986 to 2024, have been read once against the drought index and are spent for that driver (results/harvest-drought.md, results/crops-drought.md)"
known_biases = "Each figure carries a flag: A official, E estimated, I imputed, X from another organisation, M missing. Estimated and outside figures are often carried forward (equal to the year before in 9% and 19% of cases, against 1% of official ones). Yield is production divided by area harvested, so it carries the errors of both. The latest years are less official (maize: 88 official of 163 in 2024, 133 of 161 in 2010). Countries change: USSR, Yugoslav SFR, Czechoslovakia, Ethiopia PDR, Sudan (former) and Belgium-Luxembourg end and their successors begin; China appears three times (China, mainland, Taiwan). National and annual only"

[faostat_cp]
source_url = "https://bulks-faostat.fao.org/production/ConsumerPriceIndices_E_All_Data_(Normalized).zip"
fetch_script = "scripts/fetch_faostat_prices.py"
version = "FAOSTAT, Prices: Consumer Price Indices (CP), bulk file in long form; FAOSTAT's list of bulk files (https://bulks-faostat.fao.org/production/datasets_E.json) gives it as updated 2026-10-20, 266,292 rows, 2,090 KB; the CSV inside the zip is stamped 2026-10-09. The address carries no release date: a later fetch may be a different file"
licence = "CC BY 4.0, per FAO's Statistical Database Terms of Use (https://www.fao.org/contact-us/terms/db-terms-of-use/en/, read at source 2026-11-11 by the project session): 'all datasets disseminated through FAO corporate statistical databases' 'are licensed under the Creative Commons Attribution-4.0 International licence', 'Unless specified otherwise in their metadata or webpage'; the terms warn of 'data provided by third parties which may not be redistributed or reused without the consent of the original data provider'. The metadata (https://files-faostat.fao.org/production/CP/CP_e.pdf, read as text and searched by the project session) names the IMF's consumer price indices as first source, gaps filled from UNSD, then OECD, BCEAO, ECCB, UNCTAD and national offices, and holds no sentence on licence, reuse, redistribution or consent; the data are taken as usable under FAO's CC BY 4.0 with that written beside it, and the IMF's own terms (https://www.imf.org/en/about/copyright-and-terms) ask permission for commercial reuse, so the files stay on this box and are never committed or passed on. Cite, in FAO's form: FAO. 2026. FAOSTAT: Consumer Price Indices. Accessed on 11 November 2026. https://www.fao.org/faostat/en/#data/CP Licence: CC-BY-4.0."
fetched = "2026-11-11"
sha256 = "93aeb871c7c698bd04336268e8eed482bd4961621dd5e070c7ba75b288b99ec3"
coverage = "One zip of 2,139,735 bytes holding the CSV (41,322,318 bytes, 266,292 rows) and four code tables. Nine items (the general index, the food index and food price inflation, each with a weighted-average and a median item that exist for groups of countries only), months only (no year's-value rows), 2000-01 to 2026-06 (inflation from 2001). Used here: the three country items, 186,886 values in 202 places (73,476 rows of groups of countries dropped, 90 rows with no value dropped, 6 areas with no Natural Earth match set aside: French Guiana, Guadeloupe, Martinique, Netherlands Antilles, Reunion, Sub-Saharan Africa); countries with 120 or more monthly values: 202 (general index), 199 (food index), 199 (food inflation)"
known_biases = "Much of the data is the IMF's, passed on by FAO under FAO's terms, and the IMF's own terms ask permission for commercial reuse: the files stay on this box and are never committed or passed on. Some months are estimates filling gaps (flag E is the largest flag), and gaps inside a series are filled by estimation by the makers; flag X is a figure from an outside organisation. The base year is 2015 and the whole series is rescaled when FAO changes it, so a later fetch may differ in every value of an index. The food inflation figures (all flag E; how they are calculated was not checked) can reach hundreds of thousands of percent in a hyperinflation. Groups of countries (area codes 5000 and over, and Sub-Saharan Africa) are in the file and are not used. A new release replaces the old file at the same address"

[faostat_pe]
source_url = "https://bulks-faostat.fao.org/production/Exchange_rate_E_All_Data_(Normalized).zip"
fetch_script = "scripts/fetch_faostat_prices.py"
version = "FAOSTAT, Prices: Exchange rates (PE), bulk file in long form; FAOSTAT's list of bulk files (https://bulks-faostat.fao.org/production/datasets_E.json) gives it as updated 2026-09-16, 151,212 rows, 1,245 KB; the CSV inside the zip is stamped 2026-10-05. The address carries no release date: a later fetch may be a different file"
licence = "CC BY 4.0, per FAO's Statistical Database Terms of Use (https://www.fao.org/contact-us/terms/db-terms-of-use/en/, read at source 2026-11-11 by the project session): 'all datasets disseminated through FAO corporate statistical databases' 'are licensed under the Creative Commons Attribution-4.0 International licence', 'Unless specified otherwise in their metadata or webpage'; the terms warn of 'data provided by third parties which may not be redistributed or reused without the consent of the original data provider'. The exchange rates metadata was not read; the licence is the one the terms give to all FAO statistical databases, and the first source of the figures was not checked, so the files stay on this box and are never committed or passed on. Cite, in FAO's form: FAO. 2026. FAOSTAT: Exchange rates. Accessed on 11 November 2026. https://www.fao.org/faostat/en/#data/PE Licence: CC-BY-4.0."
fetched = "2026-11-11"
sha256 = "53f4dff4a42669eaa45c4946986e80d82130eadd96989b2d98d72b398187c1da"
coverage = "One zip of 1,274,156 bytes holding the CSV (21,787,229 bytes, 151,212 rows) and four code tables. Two elements: local currency units per US dollar (LCU, by month 1970-01 to 2026-07 and by year to 2025) and standard local currency units per US dollar (SLC, by year only). Used here: 145,603 values in 221 places (21 rows with no value dropped, 1,342 rows with two currencies in one country and period set aside, 9 areas with no Natural Earth match set aside: Czechoslovakia, French Guiana, Guadeloupe, Martinique, Mayotte, Netherlands Antilles, Reunion, Sudan (former), Yugoslav SFR); countries with 120 or more monthly values of LCU: 207"
known_biases = "These are official exchange rates, which can stand far from the rate people pay (and the file's figures are almost all flag X, from an outside organisation). When a country changes its currency the rate in local currency units jumps by the redenomination and the level of a series breaks; the standard local currency element (SLC, by year only) restates the old years in the current currency. A country-period with rows in two currencies is ambiguous and is not used. Groups of countries are in the file and are not used. A new release replaces the old file at the same address"

