# One entry per dataset, written when it is first fetched (rule 10). Data itself is never committed.

[ucdp_ged]
source_url = "https://ucdp.uu.se/downloads/ged/ged261-csv.zip"
fetch_script = "scripts/fetch_ucdp_ged.py"
version = "26.1, frozen release"
licence = "CC BY 4.0; cite the publications listed at https://ucdp.uu.se/downloads/"
fetched = "2026-11-05"
sha256 = "8c941d84954e555ee2e54f40fa04d9203bf1e2f962203d0a9930966c4947c667"
codebook_sha256 = "f767380ebbf365aec7586f98b6d100cafb69fb54010a908604d53bd9ad655972"
coverage = "Global events 1989 to 2025; Africa 74,836 events"
known_biases = "Fatal events only; 24.7% of African events placed coarser than 25 km; depends on media and other reporting, which may vary with access"

[spei]
source_url = "https://spei.csic.es/spei_database/nc/spei03.nc"
fetch_script = "scripts/fetch_spei.py"
version = "SPEIbase 2.11.0, built from CRU TS 4.09"
licence = "ODbL 1.0, contents DbCL 1.0; results need attribution and an ODbL notice"
