fetch_script = "scripts/fetch_ucdp_ged.py"
version = "26.1, frozen release"
licence = "CC BY 4.0; cite the publications listed at https://ucdp.uu.se/downloads/"
fetched = "2026-11-05"
sha256 = "8c941d84954e555ee2e54f40fa04d9203bf1e2f962203d0a9930966c4947c667"
