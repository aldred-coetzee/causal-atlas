sha256 = "6bdb1fabdd1b955483bdfca5e7f963f5f0ba10e199bdbf20d999f40fb207aa05"
coverage = "Global 0.5 degree, monthly, 1901-01 to 2024-12"
known_biases = "Built from CRU TS; quality over Africa, where station data may be thin, not checked"

[oni]
source_url = "https://psl.noaa.gov/data/correlation/oni.data"
fetch_script = "scripts/fetch_oni.py"
version = "File as fetched: ERSST v6, stated as of 2026-09-07"
