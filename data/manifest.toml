[wdi]
source_url = "https://databank.worldbank.org/data/download/WDI_CSV.zip"
fetch_script = "scripts/fetch_wdi.py"
version = "World Bank, World Development Indicators, bulk CSV; the address answers 301 to https://databankfiles.worldbank.org/public/ddpext_download/WDI_CSV.zip and the file is replaced there by each release (the Data Catalog page for the dataset, https://datacatalog.worldbank.org/search/dataset/0037712/World-Development-Indicators, lists a dated copy, WDI_CSV_2026_10_08.zip, of the same size, 283,089,754 bytes). The address carries no release date: a later fetch may be a different file"
licence = "CC BY 4.0 for the data set, per the Data Catalog page (read at source 2026-11-11): 'This dataset is licensed under Creative Commons Attribution 4.0.' The Bank's licences page (https://datacatalog.worldbank.org/public-licenses) says CC-BY 4.0 'allows users to copy, modify and distribute data in any format for any purpose, including commercial use', users being 'only obligated to give appropriate credit (attribution)' and to indicate changes. Each indicator carries its own licence in the series file (WDISeries.csv, column License Type): 1,489 of 1,498 say 'CC BY-4.0', 6 'SIPRI terms and conditions' and 3 'CC BY 3.0 IGO'; only the CC BY-4.0 ones are used"
fetched = "2026-11-11"
sha256 = "1cbb81b7e8e656e05fe9236f201d6d59a82d62a77f96c147c1bc63940a7b0c0c"
coverage = "1,498 indicators by country and year, 1960 to 2025; one zip of 283,089,754 bytes holding WDICSV.csv (198,924,434 bytes, 398,468 rows, one a country-or-aggregate and indicator, 9,045,734 values), the series file WDISeries.csv (one row an indicator, with Topic, Unit of measure and License Type), the country file WDICountry.csv (265 rows: 217 countries, which carry a Region, and 48 aggregates, which do not), and footnote and country-series files not used. Used here: the 609 indicators that are CC BY-4.0 in the series file and have at least 100 countries each with at least 30 yearly values (5,382,605 values in 215 places, 1960 to 2025); the 2 countries with no Natural Earth match (Channel Islands, Kosovo) are set aside and the 48 aggregates dropped"
known_biases = "Figures are revised between releases, and a new release replaces the old file at the same address. Many are estimates or gap-filled series made by the Bank or by UN agencies, not national measurements, and the file carries no flag for which. Coverage is thin before 1990 for many indicators and for poor countries (29,120 values of the kept series in 1960, 85,802 in 1990, 111,023 in 2010), and the newest years are thin again (57,622 in 2025). Definitions and sources differ by indicator and sometimes by country and year. Money is in the unit the indicator names (current or constant US$, or local currency units, which differ by country). Of the 1,498, 9 are not CC BY-4.0 (6 under SIPRI terms, 3 CC BY 3.0 IGO) and are not used. Countries change over time and the file does not carry predecessor states as separate rows"

